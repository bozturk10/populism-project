[project]
name = "populism-project"
version = "0.1.0"
description = "Reproducible ESS, PopuList, and ParlGov analysis in Python"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdown>=3.10",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.3",
    "scipy>=1.16",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/populism_project"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
